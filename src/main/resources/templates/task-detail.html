<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Task – ${task.title}|">Task Detail</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e2a3a, #0f1117); border-bottom: 1px solid #2d3748; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 2rem; }
        .card { background: #1e2a3a; border: 1px solid #2d3748; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; margin-bottom: 1rem; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .meta-item label { font-size: 0.75rem; color: #64748b; display: block; margin-bottom: 0.2rem; }
        .meta-item span { font-size: 0.9rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
        .badge-todo { background: #374151; color: #9ca3af; }
        .badge-in_progress { background: #1e40af; color: #93c5fd; }
        .badge-done { background: #065f46; color: #6ee7b7; }
        .badge-cancelled { background: #7f1d1d; color: #fca5a5; }
        .form-row { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
        .form-group label { font-size: 0.8rem; color: #64748b; }
        .form-group select { background: #0f1117; border: 1px solid #2d3748; border-radius: 0.5rem; color: #e2e8f0; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
        .btn { padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-primary { background: #38bdf8; color: #0f1117; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-back { background: #374151; color: #e2e8f0; }
        .btn:hover { opacity: 0.85; }
        .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; background: #065f46; color: #6ee7b7; border: 1px solid #047857; }
        .description-box { background: #0f1117; border: 1px solid #2d3748; border-radius: 0.5rem; padding: 1rem; color: #94a3b8; font-size: 0.875rem; min-height: 80px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>⚡ Synapse Task Manager</h1>
    </div>
</div>
<div class="container">
    <a href="/" class="btn btn-back" style="margin-bottom:1rem;">← Back to All Tasks</a>

    <div th:if="${successMessage}" class="alert" th:text="${successMessage}"></div>

    <div class="card">
        <h2 th:text="${task.title}">Task Title</h2>

        <div class="meta-grid" style="margin-bottom:1rem;">
            <div class="meta-item">
                <label>Status</label>
                <span th:class="|badge badge-${task.status.name().toLowerCase()}|" th:text="${task.status}"></span>
            </div>
            <div class="meta-item">
                <label>Priority</label>
                <span th:text="${task.priority}"></span>
            </div>
            <div class="meta-item">
                <label>Assigned To</label>
                <span th:text="${task.assignedTo ?: 'Unassigned'}"></span>
            </div>
            <div class="meta-item">
                <label>Task ID</label>
                <span th:text="${'#' + task.id}"></span>
            </div>
            <div class="meta-item">
                <label>Created</label>
                <span th:text="${#temporals.format(task.createdAt, 'MMM dd, yyyy HH:mm')}"></span>
            </div>
            <div class="meta-item">
                <label>Last Updated</label>
                <span th:text="${#temporals.format(task.updatedAt, 'MMM dd, yyyy HH:mm')}"></span>
            </div>
        </div>

        <div class="meta-item">
            <label>Description</label>
            <div class="description-box" th:text="${task.description ?: 'No description provided.'}"></div>
        </div>
    </div>

    <!-- Change status -->
    <div class="card">
        <h2>Update Status</h2>
        <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post" class="form-row">
            <div class="form-group">
                <label>New Status</label>
                <select name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${task.status == s}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </div>

    <!-- Delete -->
    <div class="card">
        <h2>Danger Zone</h2>
        <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Are you sure you want to delete this task? This cannot be undone.')">
                Delete Task
            </button>
        </form>
    </div>
</div>
</body>
</html>
