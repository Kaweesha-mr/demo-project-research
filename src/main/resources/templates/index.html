<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Task Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e2a3a, #0f1117); border-bottom: 1px solid #2d3748; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .header p { color: #64748b; font-size: 0.875rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #1e2a3a; border: 1px solid #2d3748; border-radius: 0.75rem; padding: 1.25rem; text-align: center; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: #38bdf8; }
        .stat-card .label { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
        .card { background: #1e2a3a; border: 1px solid #2d3748; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; margin-bottom: 1rem; }
        .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 200px; }
        .form-group label { font-size: 0.8rem; color: #64748b; }
        .form-group input, .form-group select, .form-group textarea {
            background: #0f1117; border: 1px solid #2d3748; border-radius: 0.5rem;
            color: #e2e8f0; padding: 0.5rem 0.75rem; font-size: 0.875rem;
        }
        .form-group textarea { resize: vertical; height: 80px; }
        .btn { padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: opacity 0.2s; }
        .btn-primary { background: #38bdf8; color: #0f1117; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { opacity: 0.85; }
        .filter-bar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
        .filter-bar input, .filter-bar select { background: #0f1117; border: 1px solid #2d3748; border-radius: 0.5rem; color: #e2e8f0; padding: 0.4rem 0.75rem; font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { padding: 0.75rem 1rem; text-align: left; font-size: 0.875rem; }
        th { color: #64748b; border-bottom: 1px solid #2d3748; font-weight: 500; }
        tr:hover td { background: rgba(56, 189, 248, 0.04); }
        td { border-bottom: 1px solid #1a2234; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
        .badge-todo { background: #374151; color: #9ca3af; }
        .badge-in_progress { background: #1e40af; color: #93c5fd; }
        .badge-done { background: #065f46; color: #6ee7b7; }
        .badge-cancelled { background: #7f1d1d; color: #fca5a5; }
        .badge-high { background: #7c2d12; color: #fb923c; }
        .badge-critical { background: #7f1d1d; color: #f87171; }
        .badge-medium { background: #1e3a5f; color: #60a5fa; }
        .badge-low { background: #1a3025; color: #4ade80; }
        .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; background: #065f46; color: #6ee7b7; border: 1px solid #047857; }
        a { color: #38bdf8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>⚡ Synapse Task Manager</h1>
        <p>Sample project for Synapse-CI pipeline testing</p>
    </div>
</div>
<div class="container">

    <!-- Flash message -->
    <div th:if="${successMessage}" class="alert" th:text="${successMessage}"></div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" th:text="${stats.total ?: 0}">0</div>
            <div class="label">Total Tasks</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.todo ?: 0}">0</div>
            <div class="label">To Do</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.in_progress ?: 0}">0</div>
            <div class="label">In Progress</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.done ?: 0}">0</div>
            <div class="label">Done</div>
        </div>
    </div>

    <!-- Create task form -->
    <div class="card">
        <h2>New Task</h2>
        <form th:action="@{/tasks}" method="post" th:object="${newTask}">
            <div class="form-row">
                <div class="form-group" style="flex:2">
                    <label>Title *</label>
                    <input type="text" th:field="*{title}" placeholder="Enter task title..."/>
                    <span style="color:#f87171;font-size:0.75rem;" th:errors="*{title}"></span>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select th:field="*{priority}">
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assigned To</label>
                    <input type="text" th:field="*{assignedTo}" placeholder="Name or email"/>
                </div>
            </div>
            <div class="form-row" style="margin-top:0.75rem;">
                <div class="form-group" style="flex:1">
                    <label>Description</label>
                    <textarea th:field="*{description}" placeholder="Optional description..."></textarea>
                </div>
                <div style="display:flex;align-items:flex-end;">
                    <button type="submit" class="btn btn-primary">+ Create Task</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Task list  -->
    <div class="card">
        <h2>Tasks</h2>
        <!-- Filter bar -->
        <div class="filter-bar">
            <form method="get" action="/" style="display:flex;gap:0.5rem;">
                <input type="text" name="search" th:value="${search}" placeholder="Search..."/>
                <select name="status">
                    <option value="">All Statuses</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${filterStatus == s.name()}"></option>
                </select>
                <button type="submit" class="btn btn-primary">Filter</button>
                <a href="/" class="btn" style="background:#374151;color:#e2e8f0;">Clear</a>
            </form>
        </div>

        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Assigned To</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${tasks.empty}">
                <td colspan="7" style="text-align:center;color:#64748b;padding:2rem;">No tasks found. Create your first task above!</td>
            </tr>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}" style="color:#64748b;"></td>
                <td><a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a></td>
                <td>
                    <span th:class="|badge badge-${task.status.name().toLowerCase()}|"
                          th:text="${task.status}"></span>
                </td>
                <td>
                    <span th:class="|badge badge-${task.priority.name().toLowerCase()}|"
                          th:text="${task.priority}"></span>
                </td>
                <td th:text="${task.assignedTo ?: '-'}" style="color:#94a3b8;"></td>
                <td th:text="${#temporals.format(task.createdAt, 'MMM dd, HH:mm')}" style="color:#64748b;font-size:0.8rem;"></td>
                <td>
                    <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger" style="padding:0.25rem 0.75rem;font-size:0.75rem;"
                                onclick="return confirm('Delete this task?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
