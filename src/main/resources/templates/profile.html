<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Synapse Task Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e2a3a, #0f1117); border-bottom: 1px solid #2d3748; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .header a { color: #38bdf8; text-decoration: none; }
        .header a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .card { background: #1e2a3a; border: 1px solid #2d3748; border-radius: 0.75rem; padding: 2rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.25rem; font-weight: 600; color: #e2e8f0; margin-bottom: 1.5rem; border-bottom: 1px solid #2d3748; padding-bottom: 1rem; }
        .profile-field { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #1a2234; }
        .profile-field label { color: #64748b; font-weight: 500; }
        .profile-field value { color: #e2e8f0; }
        .profile-field:last-child { border-bottom: none; }
        .badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
        .badge-ADMIN { background: #7f1d1d; color: #f87171; }
        .badge-MANAGER { background: #1e40af; color: #93c5fd; }
        .badge-USER { background: #065f46; color: #6ee7b7; }
        .btn { display: inline-block; padding: 0.6rem 1.25rem; background: #38bdf8; color: #0f1117; border: none; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-group { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; background: #065f46; color: #6ee7b7; border: 1px solid #047857; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>⚡ Synapse Task Manager</h1>
    </div>
    <div>
        <a href="/">Dashboard</a> | <a href="/auth/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>👤 User Profile</h2>

        <div class="profile-field">
            <label>User ID:</label>
            <value th:text="${user.id}">-</value>
        </div>

        <div class="profile-field">
            <label>Username:</label>
            <value th:text="${user.username}">-</value>
        </div>

        <div class="profile-field">
            <label>Full Name:</label>
            <value th:text="${user.fullName}">-</value>
        </div>

        <div class="profile-field">
            <label>Email:</label>
            <value th:text="${user.email}">-</value>
        </div>

        <div class="profile-field">
            <label>Role:</label>
            <value>
                <span th:class="|badge badge-${user.role}|" th:text="${user.role}"></span>
            </value>
        </div>

        <div class="profile-field">
            <label>Status:</label>
            <value>
                <span th:if="${user.active}" style="color: #6ee7b7;">🟢 Active</span>
                <span th:unless="${user.active}" style="color: #f87171;">🔴 Inactive</span>
            </value>
        </div>

        <div class="profile-field">
            <label>Member Since:</label>
            <value th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">-</value>
        </div>

        <div class="profile-field">
            <label>Last Login:</label>
            <value th:if="${user.lastLogin}" th:text="${#temporals.format(user.lastLogin, 'MMM dd, yyyy HH:mm')}">-</value>
            <value th:unless="${user.lastLogin}" style="color: #64748b;">Never</value>
        </div>

        <div class="btn-group">
            <a href="/" class="btn">← Back to Dashboard</a>
            <a href="/auth/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <div style="color: #64748b; font-size: 0.875rem; text-align: center; margin-top: 2rem;">
        <p>Contact support for account modifications or security concerns</p>
    </div>
</div>
</body>
</html>
