<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Synapse Task Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .register-container { background: #1e2a3a; border: 1px solid #2d3748; border-radius: 0.75rem; padding: 2rem; width: 100%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .register-container h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; }
        .register-container p { color: #64748b; text-align: center; margin-bottom: 2rem; font-size: 0.875rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
        .form-group label { color: #64748b; font-size: 0.875rem; font-weight: 500; }
        .form-group input { background: #0f1117; border: 1px solid #2d3748; border-radius: 0.5rem; color: #e2e8f0; padding: 0.75rem; font-size: 0.875rem; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        .form-group input::placeholder { color: #475569; }
        .btn { width: 100%; padding: 0.75rem; background: #38bdf8; color: #0f1117; border: none; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .alert-error { background: #7f1d1d; color: #f87171; border: 1px solid #b91c1c; }
        .footer-links { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; font-size: 0.875rem; }
        .footer-links a { color: #38bdf8; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
        .error-message { color: #f87171; font-size: 0.75rem; margin-top: 0.25rem; }
    </style>
</head>
<body>
<div class="register-container">
    <h1>⚡ Synapse</h1>
    <p>Task Manager - Create Account</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Choose a username" required/>
            <span class="error-message" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Your full name" required/>
            <span class="error-message" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="your.email@example.com" required/>
            <span class="error-message" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="At least 6 characters" required/>
            <span class="error-message" th:errors="*{password}"></span>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="footer-links">
        <span style="color: #64748b;">Already have account? <a href="/auth/login">Sign In</a></span>
    </div>
</div>
</body>
</html>
